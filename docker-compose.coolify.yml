# docker-compose.coolify.yml - Optimizado para Coolify
# Solo el Gateway es público, todo lo demás es interno

services:
  gateway:
    build:
      context: .
      dockerfile: src/Gateway/API/Dockerfile
    ports:
      - "8090:8080"
    networks:
      - pixpro_net
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - Jwt__Secret=${JWT_SECRET}
      - Jwt__Issuer=${JWT_ISSUER}
      - Jwt__Audience=${JWT_AUDIENCE}
      - Auth0__Domain=${AUTH0_DOMAIN}
      - Auth0__Audience=${AUTH0_AUDIENCE}
      - ReverseProxy__Clusters__auth-cluster__Destinations__auth-api-1__Address=http://auth:8081
      - ReverseProxy__Clusters__projects-cluster__Destinations__projects-api-1__Address=http://projects:8082
      - ReverseProxy__Clusters__notifications-cluster__Destinations__notifications-api-1__Address=http://notifications:8083
      - ReverseProxy__Clusters__ia-cluster__Destinations__ia-api-1__Address=http://ia:8084
      - REDIS_CONNECTION=redis:6379
      - Redis__Password=${REDIS_PASSWORD}
      - Cors__AllowedOrigins__0=${CORS_ALLOWED_ORIGIN_0}
    depends_on:
      - auth
      - projects
      - notifications
      - ia
      - redis
    healthcheck:
      test: curl --fail http://localhost:8080/health || exit 1
      interval: 10s
      timeout: 5s
      retries: 5

  auth:
    build:
      context: .
      dockerfile: src/Services/Auth/API/Dockerfile
    expose:
      - "8081"
    networks:
      - pixpro_net
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8081
      - AUTH_DB_CONNECTION=Host=db;Port=5432;Database=pixpro_auth;Username=postgres;Password=${DB_PASSWORD}
      - Jwt__Secret=${JWT_SECRET}
      - Jwt__Issuer=${JWT_ISSUER}
      - Jwt__Audience=${JWT_AUDIENCE}
      - Auth0__Domain=${AUTH0_DOMAIN}
      - Auth0__Audience=${AUTH0_AUDIENCE}
      - REDIS_CONNECTION=redis:6379
      - Redis__Password=${REDIS_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  projects:
    build:
      context: .
      dockerfile: src/Services/Projects/API/Dockerfile
    expose:
      - "8082"
    networks:
      - pixpro_net
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8082
      - ConnectionStrings__ProjectsDb=Host=projects-db;Port=5432;Database=pixpro_projects;Username=postgres;Password=${PROJECTS_DB_PASSWORD}
      - Jwt__Secret=${JWT_SECRET}
      - Jwt__Issuer=${JWT_ISSUER}
      - Jwt__Audience=${JWT_AUDIENCE}
      - Auth0__Domain=${AUTH0_DOMAIN}
      - Auth0__Audience=${AUTH0_AUDIENCE}
      - Cloudinary__CloudName=${CLOUDINARY_CLOUD_NAME}
      - Cloudinary__ApiKey=${CLOUDINARY_API_KEY}
      - Cloudinary__ApiSecret=${CLOUDINARY_API_SECRET}
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Username=${RABBITMQ_USER}
      - RabbitMQ__Password=${RABBITMQ_PASSWORD}
    depends_on:
      rabbitmq:
        condition: service_healthy
      projects-db:
        condition: service_healthy

  ia:
    build:
      context: .
      dockerfile: src/Services/IA/Dockerfile
    expose:
      - "8084"
    networks:
      - pixpro_net
    environment:
      - DATABASE_URL=postgresql://postgres:${IA_DB_PASSWORD}@ia-db:5432/pixpro_ia
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Username=${RABBITMQ_USER}
      - RabbitMQ__Password=${RABBITMQ_PASSWORD}
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - POLLINATIONS_API_KEY=${POLLINATIONS_API_KEY}
      - POLLINATIONS_ENDPOINT=${POLLINATIONS_ENDPOINT}
      - PIXAZO_API_KEY=${PIXAZO_API_KEY}
      - NANOBANANA_API_KEY=${NANOBANANA_API_KEY}
    depends_on:
      rabbitmq:
        condition: service_healthy
      ia-db:
        condition: service_healthy

  notifications:
    build:
      context: .
      dockerfile: src/Services/Notifications/API/Dockerfile
    expose:
      - "8083"
    networks:
      - pixpro_net
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8083
      - ConnectionStrings__NotificationsDb=mongodb://${NOTIFICATIONS_DB_USER}:${NOTIFICATIONS_DB_PASSWORD}@notifications-db:27017/pixpro_notifications?authSource=admin
      - ConnectionStrings__Redis=redis:6379
      - Redis__Password=${REDIS_PASSWORD}
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Username=${RABBITMQ_USER}
      - RabbitMQ__Password=${RABBITMQ_PASSWORD}
      - Jwt__Secret=${JWT_SECRET}
      - Jwt__Issuer=${JWT_ISSUER}
      - Jwt__Audience=${JWT_AUDIENCE}
      - Auth0__Domain=${AUTH0_DOMAIN}
      - Auth0__Audience=${AUTH0_AUDIENCE}
    depends_on:
      rabbitmq:
        condition: service_healthy
      notifications-db:
        condition: service_started
      redis:
        condition: service_healthy

  # Message Broker - Solo interno
  rabbitmq:
    image: rabbitmq:3-management-alpine
    expose:
      - "5672"
      - "15672"
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - pixpro_net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Base de datos Auth - Solo interna
  db:
    image: postgres:16-alpine
    expose:
      - "5432"
    environment:
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=pixpro_auth
      - POSTGRES_USER=postgres
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - pixpro_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Base de datos Projects - Solo interna
  projects-db:
    image: postgres:16-alpine
    expose:
      - "5432"
    environment:
      - POSTGRES_DB=pixpro_projects
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${PROJECTS_DB_PASSWORD}
    volumes:
      - projects_db_data:/var/lib/postgresql/data
    networks:
      - pixpro_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Base de datos IA - Solo interna
  ia-db:
    image: postgres:16-alpine
    expose:
      - "5432"
    environment:
      - POSTGRES_DB=pixpro_ia
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${IA_DB_PASSWORD}
    volumes:
      - ia_db_data:/var/lib/postgresql/data
    networks:
      - pixpro_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Base de datos Notifications (MongoDB) - Solo interna
  notifications-db:
    image: mongo:7.0
    expose:
      - "27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${NOTIFICATIONS_DB_USER}
      - MONGO_INITDB_ROOT_PASSWORD=${NOTIFICATIONS_DB_PASSWORD}
      - MONGO_INITDB_DATABASE=pixpro_notifications
    volumes:
      - notifications_db_data:/data/db
    networks:
      - pixpro_net

  # Redis - Solo interno
  redis:
    image: redis:7.2-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD}
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    networks:
      - pixpro_net
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

networks:
  pixpro_net:
    driver: bridge

volumes:
  ia_db_data:
  db_data:
  projects_db_data:
  notifications_db_data:
  rabbitmq_data:
  redis_data:
